# Local, single-host Postgres for development and the pilot's first deployment. Not a production topology: no replication,
# no backups, no TLS. Passwords come from the environment (see deploy/.env.example); nothing secret is stored in this file.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${EVALRY_PG_ADMIN_PASSWORD:?set EVALRY_PG_ADMIN_PASSWORD}
      EVALRY_PG_APP_PASSWORD: ${EVALRY_PG_APP_PASSWORD:?set EVALRY_PG_APP_PASSWORD}
      EVALRY_PG_WORKER_PASSWORD: ${EVALRY_PG_WORKER_PASSWORD:?set EVALRY_PG_WORKER_PASSWORD}
      POSTGRES_DB: evalry
    ports:
      - "127.0.0.1:5432:5432" # loopback only
    volumes:
      - evalry-pg:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evalry"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest # pin a digest before the pilot, like the runner image
    restart: unless-stopped
    command: server /data --console-address 127.0.0.1:9001
    environment:
      MINIO_ROOT_USER: ${EVALRY_S3_ACCESS_KEY:?set EVALRY_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${EVALRY_S3_SECRET_KEY:?set EVALRY_S3_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000" # loopback only
    volumes:
      - evalry-objects:/data
  # The only service that holds ANTHROPIC_API_KEY: workers reach it with EVALRY_GEN_TOKEN and never see the provider key.
  # Workers run on the host (they start sandbox containers), so it is published on loopback only. No model or price default.
  generator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.generator
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY}
      EVALRY_GEN_MODEL: ${EVALRY_GEN_MODEL:?set EVALRY_GEN_MODEL}
      EVALRY_GEN_USD_PER_MTOK_IN: ${EVALRY_GEN_USD_PER_MTOK_IN:?set EVALRY_GEN_USD_PER_MTOK_IN}
      EVALRY_GEN_USD_PER_MTOK_OUT: ${EVALRY_GEN_USD_PER_MTOK_OUT:?set EVALRY_GEN_USD_PER_MTOK_OUT}
      EVALRY_GEN_TOKEN: ${EVALRY_GEN_TOKEN:?set EVALRY_GEN_TOKEN (32+ characters)}
      EVALRY_GEN_ALLOWED_SENSITIVITY: ${EVALRY_GEN_ALLOWED_SENSITIVITY:-public,internal}
      EVALRY_GEN_HOST: 0.0.0.0 # inside the container; the published port below is loopback only
    ports:
      - "127.0.0.1:8001:8001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  # Same image as the generator, different entry point. The rubric is the eval owner's approved file, mounted read-only; it is
  # part of the judge version, so editing it creates a new judge that must pass calibration before it can gate.
  judge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.generator
    command: ["evalry-judge"]
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY}
      EVALRY_JUDGE_MODEL: ${EVALRY_JUDGE_MODEL:?set EVALRY_JUDGE_MODEL}
      EVALRY_JUDGE_USD_PER_MTOK_IN: ${EVALRY_JUDGE_USD_PER_MTOK_IN:?set EVALRY_JUDGE_USD_PER_MTOK_IN}
      EVALRY_JUDGE_USD_PER_MTOK_OUT: ${EVALRY_JUDGE_USD_PER_MTOK_OUT:?set EVALRY_JUDGE_USD_PER_MTOK_OUT}
      EVALRY_JUDGE_TOKEN: ${EVALRY_JUDGE_TOKEN:?set EVALRY_JUDGE_TOKEN (32+ characters)}
      EVALRY_JUDGE_ALLOWED_SENSITIVITY: ${EVALRY_JUDGE_ALLOWED_SENSITIVITY:-public,internal}
      EVALRY_JUDGE_RUBRIC_FILE: /config/rubric.md
      EVALRY_JUDGE_HOST: 0.0.0.0 # inside the container; the published port below is loopback only
      EVALRY_JUDGE_PORT: "8002"
    volumes:
      - ${EVALRY_JUDGE_RUBRIC_FILE:?set EVALRY_JUDGE_RUBRIC_FILE (host path of the approved rubric)}:/config/rubric.md:ro
    ports:
      - "127.0.0.1:8002:8002"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8002/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  evalry-pg:
  evalry-objects:
